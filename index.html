/* Musso Family Olympics · Thanksgiving 2026 · Spelling Bee
   Theme: cinematic dark melt, clear glass with iridescent rim, dot-matrix numerals.
   CSS only, no WebGL. Link AFTER the inline <style> in index.html. */


:root{
  --indigo:#1e1960; --violet:#7668ff; --lime:#dbf570; --paper:#f5f4f0; --ink:#1c1c1c;
  --deep:#0b0a24; --mute:rgba(245,244,240,.78);
  --rim:linear-gradient(135deg,rgba(255,255,255,.55),rgba(118,104,255,.55) 30%,rgba(219,245,112,.35) 55%,rgba(255,255,255,.12) 75%,rgba(118,104,255,.45));
  --glass:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.06));
}

/* ---- backdrop: one smooth melt, linear layers only, no shapes ---- */
html body{
  color:var(--paper); font-family:system-ui,system-ui,sans-serif;
  background:
    linear-gradient(200deg,rgba(118,104,255,.55) 0%,rgba(118,104,255,0) 42%),
    linear-gradient(20deg,rgba(219,245,112,.10) 0%,rgba(219,245,112,0) 30%),
    linear-gradient(180deg,#1e1960 0%,#151248 45%,#0b0a24 100%);
  background-color:var(--deep);
  background-size:140% 140%,140% 140%,100% 100%;
  background-attachment:fixed;
  animation:melt 28s ease-in-out infinite alternate;
}
@keyframes melt{from{background-position:0% 0%,100% 100%,0 0}to{background-position:60% 40%,40% 60%,0 0}}
html body::before{opacity:.09;mix-blend-mode:overlay}

/* ---- type ---- */
html body .serif{font-family:system-ui,Georgia,serif;font-weight:300;letter-spacing:-.025em;line-height:1.02}
html body h1{color:var(--paper);font-weight:300;font-size:clamp(48px,14vw,64px);margin:.25em 0 .2em}
html body .grow.center>h1::before{
  content:"Musso Family Olympics \00B7  Thanksgiving 2026";
  display:block;margin:0 auto 22px;width:max-content;max-width:100%;
  font:400 22px/1 "Billa Mount",cursive;letter-spacing:0;color:var(--paper);
  padding:11px 16px;border-radius:999px;border:1px solid transparent;
  background:var(--glass) padding-box,var(--rim) border-box;
}
html body .grow.center>h1::after{
  content:"Spelling Bee";
  display:block;margin-top:10px;font:normal 400 1.9em/0.95 "Billa Mount",cursive;color:var(--lime);letter-spacing:0;
}
html body p{color:var(--mute);line-height:1.4}
html body .big{color:var(--paper)}
html body .name{color:var(--paper);font-weight:300}
html body .small{color:var(--mute);letter-spacing:.14em;text-transform:uppercase;font-size:.62em;font-weight:500}
html body .card.small{text-transform:none;letter-spacing:0;font-size:.8em;line-height:1.6}
html body .spell{color:var(--lime);letter-spacing:.28em;font-weight:300}

/* dot-matrix numerals: level hero, scores */
html body .small+.serif.big{font-family:system-ui,ui-monospace,monospace;font-weight:800;font-size:calc(160px*var(--s))!important;color:var(--lime);letter-spacing:-.02em;line-height:1}
html body .top{opacity:1;color:var(--mute);font-size:.68em;letter-spacing:.06em;align-items:center}
html body .top span:last-child{font-family:system-ui,monospace;font-weight:800;font-size:1.7em;color:var(--lime);letter-spacing:.02em}
html body td:last-child{font-family:system-ui,monospace;font-weight:800;font-size:1.5em;color:var(--lime)}
html body td{border-bottom:1px dotted rgba(245,244,240,.25);padding:12px 4px}
html body tr:first-child td:first-child{color:var(--paper);font-weight:600}

/* ---- clear glass with iridescent rim (untinted; the dark melt carries contrast) ---- */
html body button,html body .card,html body input[type=text]{
  border:1.5px solid transparent;border-radius:24px;color:var(--paper);
  background:var(--glass) padding-box,var(--rim) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 30px -16px rgba(0,0,0,.6);
  transition:transform .15s ease;
}
html body button{min-height:64px;font-weight:500;letter-spacing:.01em;border-radius:999px}
html body button:active{transform:scale(.98)}
html body .card{padding:18px 20px;line-height:1.45}
html body input[type=text]{border-radius:20px}
html body input.word{font-family:system-ui,serif;font-weight:300;font-size:36px;min-height:80px;letter-spacing:.04em}

/* one glowing central action: lime, ink text (~15:1) */
html body button.primary{
  background:linear-gradient(180deg,#e6fa94,#dbf570 60%,#c9e85a) padding-box,linear-gradient(180deg,#f4ffd0,#b5d443) border-box;
  color:var(--ink);font-weight:600;
  box-shadow:0 14px 40px -10px rgba(219,245,112,.45),inset 0 1px 0 rgba(255,255,255,.7);
}
/* hear: the hero capsule, violet melt, white text (~5:1 at its lightest stop) */
html body button.hear{
  min-height:104px;font-size:1.15em;font-weight:600;color:#fff;border-radius:32px;
  background:linear-gradient(120deg,#6a5cf0,#4a3fd6 55%,#1e1960) padding-box,var(--rim) border-box;
  box-shadow:0 18px 50px -14px rgba(118,104,255,.7),inset 0 1px 0 rgba(255,255,255,.35);
}
html body #slow{border-radius:32px}
html body button.tog.on{background:linear-gradient(180deg,rgba(245,244,240,.96),rgba(245,244,240,.88)) padding-box,var(--rim) border-box;color:var(--ink)}
html body button.ghost{background:none;border:0;box-shadow:none;color:var(--mute);min-height:48px;text-decoration:none;letter-spacing:.14em;text-transform:lowercase}
html body .prow button{width:56px;min-height:56px;border-radius:20px}
html body button:focus-visible,html body input:focus-visible{outline:3px solid var(--lime);outline-offset:3px}

/* correct flash: soft lime-to-lavender melt, ink type */
html body .wash{background:linear-gradient(160deg,rgba(219,245,112,.97),rgba(186,180,255,.97));color:var(--ink)}
html body .wash .big{color:var(--ink)}

/* confetti stays rectangles, recoloured to tokens */
html body .conf:nth-child(odd){background:var(--lime)!important}
html body .conf:nth-child(even){background:var(--violet)!important}

/* ================= TV / present layout (AirPlay, ~10 ft) =================
   Triggers on body.tv, or any landscape viewport >= 1280 wide. */
@media (min-width:1280px) and (orientation:landscape){ html body{--tv:1} }
html body.tv{--tv:1}

@media (min-width:1280px) and (orientation:landscape){
  html body #app{max-width:none;padding:3vw 6vw 3.5vw;font-size:3vw}
  html body .top{
    font-size:1.6vw;padding:1.2vw 2.4vw;border-radius:999px;border:2px solid transparent;
    background:linear-gradient(160deg,rgba(11,10,36,.55),rgba(11,10,36,.35)) padding-box,var(--rim) border-box;
  }
  html body .top span:last-child{font-size:3.4vw}
  html body h1{font-size:9vw}
  html body .grow.center>h1::before{font-size:1.4vw;padding:1vw 1.8vw}
  html body .name{font-size:5vw!important}
  html body .big{font-size:12vw}
  html body .small+.serif.big{font-size:22vw!important}
  html body .spell{font-size:7vw}
  html body p,html body .card{font-size:3vw}
  html body .small{font-size:1.5vw}
  html body .card{padding:2vw 2.6vw;border-radius:2.4vw;border-width:2px;background:linear-gradient(160deg,rgba(11,10,36,.5),rgba(11,10,36,.3)) padding-box,var(--rim) border-box}
  html body .bottom{flex-direction:row;flex-wrap:wrap;gap:1.4vw}
  html body .bottom>*{flex:1}
  html body button{min-height:6.5vw;font-size:2.4vw;border-width:2px}
  html body button.hear{min-height:9vw;font-size:3vw}
  html body #slow{min-height:9vw!important}
  html body td{font-size:3vw;padding:1vw .5vw}
  html body td:last-child{font-size:4vw}
  /* word for the room: the peek reveal becomes the 12vw hero; hidden until revealed */
  html body button.ghost{font-size:1.6vw}
  html body button.ghost:not(:empty){letter-spacing:.02em;text-transform:none}
}
html body.tv #app{max-width:none;padding:3vw 6vw 3.5vw;font-size:3vw}
html body.tv .name{font-size:5vw!important}
html body.tv .big{font-size:12vw}
html body.tv .small+.serif.big{font-size:22vw!important}
html body.tv button{min-height:6.5vw;font-size:2.4vw}
html body.tv .top span:last-child{font-size:3.4vw}

/* optional hooks the builder can add for TV: .tv-word (the revealed word) and .tv-board (scores strip) */
html body .tv-word{font-family:system-ui,serif;font-weight:300;font-size:max(12vw,64px);letter-spacing:-.03em;line-height:1;text-align:center;color:var(--paper)}
html body .tv-word[hidden],html body .tv-word:empty{display:none}
html body .tv-board{display:flex;gap:1.2vw;justify-content:center;flex-wrap:wrap;margin-bottom:2vw}
html body .tv-board>*{
  display:flex;align-items:baseline;gap:1vw;padding:.9vw 2vw;border-radius:999px;border:2px solid transparent;
  background:linear-gradient(160deg,rgba(11,10,36,.5),rgba(11,10,36,.3)) padding-box,var(--rim) border-box;
  font-size:max(3vw,18px);color:var(--paper)
}
html body .tv-board b{font-family:system-ui,monospace;font-weight:800;font-size:1.3em;color:var(--lime)}
html body .tv-board .now{background:linear-gradient(160deg,rgba(118,104,255,.55),rgba(30,25,96,.6)) padding-box,var(--rim) border-box}

/* ===== Thanksgiving autumn retheme + type (colors and fonts only) ===== */
:root{
  --indigo:#5a1220; --violet:#c4561c; --lime:#e0a23a; --paper:#f6ead8; --ink:#1e110b;
  --deep:#1e110b; --mute:rgba(246,234,216,.82);
  --rim:linear-gradient(135deg,rgba(246,234,216,.55),rgba(196,86,28,.55) 30%,rgba(224,162,58,.45) 55%,rgba(246,234,216,.12) 75%,rgba(90,18,32,.55));
}
html body{
  font-family:system-ui,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    linear-gradient(200deg,rgba(196,86,28,.42) 0%,rgba(196,86,28,0) 45%),
    linear-gradient(20deg,rgba(224,162,58,.20) 0%,rgba(224,162,58,0) 35%),
    linear-gradient(180deg,#5a1220 0%,#3a140f 45%,#1e110b 100%);
  background-color:var(--deep);
  background-size:140% 140%,140% 140%,100% 100%;
  background-attachment:fixed;
}
html body button,html body input[type=text]{font-family:system-ui,system-ui,sans-serif}
html body .serif,html body h1,html body .big,html body .name,html body input.word,html body .tv-word{
  font-family:system-ui,Georgia,"Times New Roman",serif;font-weight:500;
  font-optical-sizing:auto;font-variation-settings:"SOFT" 100;
}
html body .small+.serif.big{font-family:system-ui,ui-monospace,monospace;font-weight:800;font-variation-settings:normal}
html body .grow.center>h1::before{font-family:system-ui,system-ui,sans-serif}
html body .grow.center>h1::after{font:italic 400 .42em/1.2 system-ui,Georgia,serif;font-variation-settings:"SOFT" 100;color:var(--lime)}
html body button.primary{
  background:linear-gradient(180deg,#f0c060,#e0a23a 60%,#cf8f2a) padding-box,linear-gradient(180deg,#fae2a8,#b97a20) border-box;
  color:var(--ink);box-shadow:0 14px 40px -10px rgba(224,162,58,.5),inset 0 1px 0 rgba(255,255,255,.6);
}
html body button.hear{
  color:var(--paper);
  background:linear-gradient(120deg,#a8461a,#7a2a1a 55%,#5a1220) padding-box,var(--rim) border-box;
  box-shadow:0 18px 50px -14px rgba(196,86,28,.7),inset 0 1px 0 rgba(255,255,255,.3);
}
html body button.tog.on{background:linear-gradient(180deg,rgba(246,234,216,.96),rgba(246,234,216,.88)) padding-box,var(--rim) border-box;color:var(--ink)}
html body td{border-bottom-color:rgba(246,234,216,.25)}
html body .wash{background:linear-gradient(160deg,rgba(240,192,96,.97),rgba(246,218,170,.97));color:var(--ink)}
@media (min-width:1280px) and (orientation:landscape){

/* many players: scoreboard as a wrapping grid, up to 5 per row */

html body .rules{text-align:left}html body .rules p{margin:.5em 0;color:var(--paper)}

/* unslop pass: no colored glows, radius by size, no wide-tracked caps, no ambient loop */

html body button.primary{box-shadow:0 10px 24px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.45)}
html body button.hear{box-shadow:0 10px 24px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2)}
html body button,html body #slow{border-radius:16px}

html body .grow.center>h1::before{font:500 20px/1.2 system-ui,system-ui,sans-serif;letter-spacing:.06em!important;margin-bottom:34px!important;font-style:normal;font-synthesis:none;letter-spacing:0;text-transform:none;background:none;border:0;padding:0;color:var(--paper)}
html body .grow.center>h1::after{font:400 130px/1.05 "Billa Mount",cursive;font-style:normal;font-synthesis:none;letter-spacing:0;color:var(--lime);margin-top:10px;margin-bottom:70px;padding:0 40px}
html body .grow.center>h1{margin:40px 0 110px!important}html body .grow.center>h1::before{margin-bottom:70px!important}
@media (max-width:900px){html body .grow.center>h1::before{font-size:26px}html body .grow.center>h1::after{font-size:84px}}
.startlinks{display:flex;gap:28px;justify-content:center;margin-top:14px}
html body .startlinks .link{background:none;border:0;box-shadow:none;padding:6px 2px;min-height:0;width:auto;color:var(--mute);font-size:18px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.optpanel{margin:14px auto 0;padding:16px;border-radius:18px;background:var(--glass);max-width:560px;display:flex;flex-direction:column;gap:10px}
html body .grow.center>h1::before{margin-bottom:60px;line-height:1.3}
html body .grow.center>h1::after{margin-bottom:60px;line-height:1.15}
html body .bottom.startbottom{flex-direction:column;align-items:center}
html body .bottom.startbottom>#go{width:min(720px,100%);flex:none}
html body .startlinks{align-items:center;flex-wrap:wrap}
html body .startlinks .dotsep{color:var(--mute)}
html body .turnjudge .row{gap:16px}
html body button.judge{min-height:72px;flex:1;background:var(--glass);color:var(--paper);font-weight:500}
html body .corner{position:fixed;right:18px;bottom:10px;display:flex;gap:18px;z-index:5}
html body .corner .link,html body .startlinks .link{font-size:16px}
html body .corner .link{background:none;border:0;box-shadow:none;padding:4px 2px;min-height:0;width:auto;color:var(--mute);text-decoration:underline;text-underline-offset:4px}
html.tv body .startlinks .link{font-size:max(1.4vw,18px)}
/* ===== v5 type + spacing system: Billa Mount only on "Spelling Bee"; SF Pro elsewhere; 8px grid ===== */
:root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
 --f-util:13px;--f-meta:15px;--f-body:17px;--f-btn:17px;--f-lead:22px;--f-h:28px;--f-hero:40px;--f-word:64px;--f-num:96px;
 --g1:8px;--g2:16px;--g3:24px;--g4:32px;--g5:48px;--g6:64px}
@media (min-width:1280px) and (orientation:landscape){:root{
 --f-util:16px;--f-meta:24px;--f-body:30px;--f-btn:30px;--f-lead:38px;--f-h:56px;--f-hero:80px;--f-word:160px;--f-num:200px;
 --g1:12px;--g2:24px;--g3:36px;--g4:48px;--g5:72px;--g6:96px}}
html body,html body *,html body button,html body input,html body input[type=text],html body .serif,html body h1,html body h2,html body .big,html body .name,html body .tv-word,html body input.word,html body .spell,html body .small,html body .top span,html body td,html body .tv-board b,html body .grow.center>h1::before{
 font-family:var(--sf)!important;letter-spacing:-0.02em!important;font-variation-settings:normal;font-style:normal}
html body .grow.center>h1::after{font-family:"Billa Mount",cursive!important;letter-spacing:0!important}
html body{font-size:var(--f-body);line-height:1.4}
html body #app{max-width:560px;padding:calc(var(--g3) + env(safe-area-inset-top)) calc(var(--g3) + env(safe-area-inset-right)) calc(var(--g2) + env(safe-area-inset-bottom)) calc(var(--g3) + env(safe-area-inset-left));font-size:var(--f-body);gap:0}
@media (min-width:1280px) and (orientation:landscape){html body #app{max-width:1600px;padding:var(--g4) var(--g6) var(--g3)}}
html body p{font-size:var(--f-body);font-weight:400;line-height:1.45;margin:0 0 var(--g2)}
html body .small{font-size:var(--f-meta)!important;font-weight:400;color:var(--mute);text-transform:none;margin-bottom:var(--g1)}
/* numerals: SF Pro tabular instead of Doto */
html body .top span:last-child,html body td:last-child,html body .tv-board b,html body .small+.serif.big{font-variant-numeric:tabular-nums;font-weight:600!important;color:var(--lime)}
/* meta row */
html body .top{font-size:var(--f-meta)!important;font-weight:400;color:var(--mute);padding:0;background:none!important;border:0;margin:0 0 var(--g2);min-height:0;align-items:baseline}
html body .top span:last-child{font-size:var(--f-meta)!important}
/* player tiles */
html body .tv-board{gap:var(--g1);margin:0 0 var(--g1)}
html body .tv-board>*{font-size:var(--f-meta)!important;font-weight:500;padding:var(--g1) var(--g2);min-height:40px;align-items:center;gap:var(--g1)}
html body .tv-board b{font-size:1em!important}
html body .tv-board>.out b{font-size:.85em!important;font-weight:400!important}
@media (min-width:1280px) and (orientation:landscape){html body .tv-board>*{min-height:64px}}
/* headings */
html body h1{margin:0!important;font-size:0}
html body .grow.center>h1::before{font:500 var(--f-meta)/1.3 var(--sf)!important;color:var(--mute);margin:0 0 var(--g3)!important;padding:0;background:none;border:0}
html body .grow.center>h1::after{font-size:clamp(72px,22vw,96px)!important;line-height:1.05!important;margin:0 0 var(--g4)!important;padding:0 var(--g1)!important}
@media (min-width:1280px) and (orientation:landscape){html body .grow.center>h1::after{font-size:180px!important}html body .grow.center>h1::before{font-size:var(--f-lead)!important}}

<script>
"use strict";
var WORDS=JSON.parse(document.getElementById('words').textContent).words;
var LEVELS=['Warm-up','A bit harder','Tricky','Really tricky','The final word'];
var KEY='musso-bee-2026';
var app=document.getElementById('app');
var S=null;            // game state (persisted)
var cfg={mode:'host',sudden:false,game:'teams'};
var ui={show:'',peek:false,names:[],teams:null};   // transient
var voice=null;
var KEYS=matchMedia('(hover:hover) and (pointer:fine)').matches;var TV=/[?&]tv=1/.test(location.search)||(window.innerWidth>=1000&&window.innerWidth>window.innerHeight);
if(TV)document.documentElement.className='tv';
window.addEventListener('DOMContentLoaded',function(){document.body.className='tv'});
function dots(n){var s='';for(var i=0;i<n;i++)s+='<i class="dot"></i>';return '<span class="dots" aria-label="'+n+' points">'+s+'</span>'}
function fullscreen(){var d=document,e=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}catch(err){console.warn('fullscreen not available',err)}}

function $(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* speech */
function pickVoice(){
  if(!window.speechSynthesis)return;
  var v=speechSynthesis.getVoices();
  voice=v.filter(function(x){return x.lang==='en-US'||x.lang==='en_US'})[0]||v.filter(function(x){return /^en/.test(x.lang)})[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.rate=rate||.9;u.lang='en-US';if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}

/* state */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn('save failed',e)}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function newGame(names){
  S={game:cfg.game,mode:TV?'host':cfg.mode,sudden:cfg.sudden,screen:'intro',level:1,turn:0,
     players:names.map(function(n){return{name:n,score:0,misses:0,out:false,best:null}}),pool:[],last:null,prev:null};
  if(S.game==='classic'){S.used=[];S.round=0;cRound(true)}else buildPool();
  save();
}
function buildPool(){
  var lw=WORDS.filter(function(w){return w.level===S.level});
  var need=S.players.length,pool=shuffle(lw);
  while(pool.length<need)pool=pool.concat(shuffle(lw));
  S.pool=pool.slice(0,Math.max(need,10));
}
function classic(){return S&&S.game==='classic'}
function teams(){return S&&S.game==='teams'}
function cur(){return classic()||teams()?S.cw:S.pool[S.turn]}
function curPlayer(){return classic()?S.players[S.cp]:S.players[S.turn%S.players.length]}

/* classic bee */
function pick(){
  var used=S.used,l,c=[];
  for(l=S.level;l<=5;l++){
    c=WORDS.filter(function(w){return w.level===l&&used.indexOf(w.word)<0});
    if(c.length){S.level=l;break}
  }
  if(!c.length)c=WORDS.filter(function(w){return used.indexOf(w.word)<0});
  if(!c.length){S.used=[];used=S.used;c=WORDS.filter(function(w){return !S.cw||w.word!==S.cw.word})}
  var w=c[Math.floor(Math.random()*c.length)];used.push(w.word);return w;
}
function inIdx(){var a=[];S.players.forEach(function(p,i){if(!p.out)a.push(i)});return a}
function cRound(first){
  var a=inIdx();
  if(a.length===1){S.winner=a[0];S.screen='win';return}
  if(!first)S.level=Math.min(5,S.level+1);
  S.round++;S.order=a;S.ri=0;S.miss=[];S.fin=null;S.cp=a[0];S.cw=pick();S.screen='intro';
}
function banner(title,text,then){S.banner={title:title,text:text,then:then};go('banner')}
function cAdvance(){
  var L=S.last,f=S.fin,me=S.players[S.cp];
  if(f){
    if(f.step==='match'&&L.ok){f.step='clinch';S.cw=pick();return banner(me.name+' got it','One more word to win.','turn')}
    if(f.step==='clinch'&&L.ok){S.winner=S.cp;return go('win')}
    S.order.forEach(function(i){S.players[i].out=false;S.players[i].outRound=null});S.fin=null;
    return banner('Both stay in',f.step==='match'?'You both missed that word, so the bee goes on.':'So close. You both stay in and the bee goes on.','round');
  }
  if(!L.ok){S.miss.push(S.cp);me.out=true;me.outRound=S.round}
  if(!L.ok&&S.order.length===2){
    var other=S.order[0]===S.cp?S.order[1]:S.order[0];
    S.fin={step:'match'};S.cp=other;
    return banner(me.name+' missed','Now '+S.players[other].name+' spells the same word. Get it, then one more, and you win.','turn');
  }
  S.ri++;
  if(S.ri<S.order.length){S.cp=S.order[S.ri];S.cw=pick();return go('turn')}
  if(S.miss.length===S.order.length){
    S.miss.forEach(function(i){S.players[i].out=false;S.players[i].outRound=null});
    return banner('Everyone stays in','Every speller missed this round. In a real bee, that means nobody goes out.','round');
  }
  if(inIdx().length===1){S.winner=inIdx()[0];return go('win')}
  if(S.miss.length)return banner('Round '+S.round+' done',S.miss.map(function(i){return S.players[i].name}).join(', ')+(S.miss.length>1?' are':' is')+' out. Nice try.','round');
  return banner('Round '+S.round+' done','Everyone spelled their word. Next round is harder.','round');
}
function bannerNext(){var t=S.banner.then;if(t==='round'){cRound();save();render()}else go(t)}
function undo(){if(!S||!S.prev)return;S=S.prev;S.prev=null;ui.revealed=false;ui.show='';ui.peek=false;save();render()}
function undoBtn(){return S&&S.prev?'<button id="undo" class="'+(S.screen==='turn'?'link':'ghost')+'">Undo last tap'+(KEYS?' (U)':'')+'</button>':''}
function reveal(){ui.revealed=true;render()}
function go(screen){ui.revealed=false;S.screen=screen;ui.show='';ui.peek=false;save();render()}

function nextTurn(){
  if(classic())return cAdvance();
  var total=S.players.length;
  S.turn++;
  while(S.turn<total&&S.sudden&&curPlayer().out)S.turn++;
  if(S.turn>=total||S.players.every(function(p){return p.out})){
    if(S.level>=5||S.players.every(function(p){return p.out}))return go('end');
    return go('levelup');
  }
  go('turn');
}
function answer(ok){
  var w=cur(),p=curPlayer(),snap=JSON.parse(JSON.stringify(S));snap.prev=null;snap.screen='turn';S.prev=snap;
  if(classic()){S.last={ok:ok,word:w.word,pts:0};S.screen='result';save();render();return}
  if(ok){p.score+=w.level;if(!p.best||w.level>=p.best.level)p.best={word:w.word,level:w.level}}
  else{p.misses++;if(S.sudden&&p.misses>=2)p.out=true}
  S.last={ok:ok,word:w.word,pts:w.level};
  S.screen='result';save();render();
  
}
function afterResult(){nextTurn()}

/* views */
function board2(){return '<div class="tv-board">'+S.players.map(function(q){var c=q.out&&classic()?'out':q===curPlayer()?'now':'';return '<div'+(c?' class="'+c+'"':'')+'>'+esc(q.name)+' <b>'+(classic()?(q.out?'out':''):q.score)+'</b></div>'}).join('')+'</div>'}
function board(){
  var ps=S.players.slice().sort(function(a,b){return b.score-a.score});
  return '<table>'+ps.map(function(p){return'<tr><td>'+esc(p.name)+(p.out?' (out)':'')+'</td><td>'+p.score+'</td></tr>'}).join('')+'</table>';
}
function set(html,bind){var sc=S?S.screen:(ui.startPage?'start':'page');app.setAttribute('data-screen',sc);var fsb=(!ui.startPage&&(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))?'<button id="fs" class="ghost fsbtn util-link" aria-label="Toggle fullscreen">Fullscreen</button>':'';var un=(S&&S.prev&&/^(result|banner|win|levelup|end|tresult|twin)$/.test(S.screen))?undoBtn():'';if(/<div class="corner">/.test(html))html=html.replace(/<\/div>$/,un+fsb+'</div>');else if(un||fsb)html+='<div class="util">'+un+fsb+'</div>';app.innerHTML=html;ui.startPage=false;on('fs',fullscreen);bind&&bind()}
function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}

function render(){
  var f={tturn:vTTurn,tresult:vTResult,twin:vTWin,start:vStart,players:vPlayers,intro:vIntro,turn:vTurn,result:vResult,levelup:vLevelup,end:vEnd,banner:vBanner,win:vWin}[S?S.screen:'start'];
  window.scrollTo(0,0);f();
  if(S&&S.prev)on('undo',undo);
}
window.addEventListener('popstate',function(){if(!S)vStart()});
function vStart(){
  var saved=load();ui.startPage=true;
  set('<div class="grow center"><div style="height:8vh"></div><h1 class="serif"><span class="sr">Musso Family Olympics, Thanksgiving 2026. Spelling Bee</span></h1>'+
   '<p>'+(cfg.game==='teams'?'Two teams. One speller from each team faces off. First to buzz spells it. Right answer, one point.':cfg.game==='classic'?'One word per turn. Miss and you\'re out. Last speller standing wins.':'Five levels, one word each per level. Harder words score more.')+'</p></div>'+
   '<div class="bottom startbottom"><button id="go" class="primary">Start</button>'+
   (saved&&saved.screen&&saved.screen!=='end'?'<button id="res">Resume game</button>':'')+
   '<div class="startlinks"><button id="how" class="link">How it works</button><button id="opt" class="link" aria-expanded="'+(ui.opts?'true':'false')+'">Options</button></div>'+
   (ui.opts?'<div class="optpanel" id="optpanel"><div class="row"><button id="gt" class="tog '+(cfg.game==='teams'?'on':'')+'">Team buzzer</button><button id="gc" class="tog '+(cfg.game==='classic'?'on':'')+'">Classic bee</button><button id="gp" class="tog '+(cfg.game==='points'?'on':'')+'">Family points</button></div><div class="row"><button id="mh" class="tog '+(cfg.mode==='host'?'on':'')+'">Host reads</button><button id="mt" class="tog '+(cfg.mode==='type'?'on':'')+'">Type it</button></div>'+
   (cfg.game==='points'?'<button id="sd" class="tog '+(cfg.sudden?'on':'')+'">Sudden death: '+(cfg.sudden?'on':'off')+'</button>':'')+
   (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen?'<button id="fs" class="ghost">Fullscreen</button>':'')+'</div>':'')+'</div>',function(){
   on('opt',function(){ui.opts=!ui.opts;vStart()});
   on('mh',function(){cfg.mode='host';S=null;vStart()});on('mt',function(){cfg.mode='type';S=null;vStart()});
   on('sd',function(){cfg.sudden=!cfg.sudden;S=null;vStart()});
   on('gt',function(){cfg.game='teams';S=null;vStart()});on('gc',function(){cfg.game='classic';S=null;vStart()});on('gp',function(){cfg.game='points';S=null;vStart()});
   on('how',vRules);
   on('go',function(){S=null;if(cfg.game==='teams')return vTeams();ui.names=ui.names.length?ui.names:['Player 1','Player 2'];vPlayers()});
   on('res',function(){S=saved;speechPrime();render()});
  });
  S=null;
}
function vRules(){
  S=null;
  set('<div class="grow"><div class="card rules" id="rules"><h2 class="serif">Team buzzer</h2>'+
   '<p>Split into two teams. Each face-off, the next speller from each team comes up.</p>'+
   '<p>The host plays the word. First to buzz spells it out loud. Right answer, one point for their team.</p>'+
   '<p>Miss it and the other speller can buzz in to steal the point. If both miss, nobody scores.</p>'+
   '<p>Words get harder as you go. Most points wins. Keys: A buzzes the left team, L the right.</p>'+
   '<h2 class="serif" style="margin-top:.8em">Classic bee</h2>'+
   '<p>Spellers take turns in the same order. One word per turn.</p>'+
   '<p>Before you spell, you can hear the word again, ask for the definition, or hear it in a sentence.</p>'+
   '<p>Miss a word and you\'re out. Your tile goes dim and we skip you after that.</p>'+
   '<p>If everyone left misses in the same round, nobody goes out.</p>'+
   '<p>Words start easy and get harder each round.</p>'+
   '<p>Down to two? If one misses, the other has to spell that same word, then one more, to win. Miss either one and you both stay in.</p>'+
   '<p>Last speller standing wins.</p>'+
   '<h2 class="serif" style="margin-top:.8em">Family points</h2>'+
   '<p>Everyone spells one word per level, for five levels. A correct word scores its level number. Most points wins.</p>'+
   '<p>Tapped the wrong button? Hit Undo last tap.</p></div></div>'+
   '<div class="bottom"><button id="back" class="primary">Got it</button></div>',function(){on('back',vStart)});
}
function speechPrime(){if(window.speechSynthesis){var u=new SpeechSynthesisUtterance('');speechSynthesis.speak(u)}}
function vPlayers(){
  S=null;
  set('<div class="grow"><button id="bk" class="link backlink">‹ Back</button><h1 class="serif" style="font-size:44px">Who is playing?</h1><div id="pl"></div></div>'+
   '<div class="bottom"><button id="add">+ Add player</button><button id="eat" class="primary">Let\'s eat</button></div>',function(){
   on('bk',vStart);try{history.pushState({s:'setup'},'')}catch(e){}var box=document.getElementById('pl');
   ui.names.forEach(function(n,i){
     var r=$('<div class="prow"><input type="text" aria-label="Player '+(i+1)+' name" value="'+esc(n)+'"><button aria-label="Remove player '+(i+1)+'">x</button></div>');
     r.firstChild.oninput=function(){ui.names[i]=this.value};
     r.lastChild.onclick=function(){if(ui.names.length>(cfg.game==='classic'?2:1)){ui.names.splice(i,1);vPlayers()}};
     box.appendChild(r)});
   on('add',function(){if(ui.names.length<12){ui.names.push('Player '+(ui.names.length+1));vPlayers()}});
   on('eat',function(){
     var n=ui.names.map(function(x,i){return x.trim()||('Player '+(i+1))});
     if(cfg.game==='classic'&&n.length<2)n.push('Player 2');
     speechPrime();newGame(n);render()});
  });
}
function vIntro(){
  set('<div class="top"><span>Musso Family Olympics · Spelling Bee</span></div><div class="grow center"><div style="height:8vh"></div><div class="small">Level</div><div class="serif big" style="font-size:120px">'+S.level+'</div>'+
   '<div class="serif name">'+LEVELS[S.level-1]+'</div><p>'+(classic()?'Round '+S.round+'. '+S.order.length+' spellers left.':'Everyone spells one word.')+'</p></div><div class="bottom"><button id="b" class="primary">Begin</button></div>',function(){
   on('b',function(){if(classic()){go('turn');return autoHear()}S.turn=0;while(S.sudden&&curPlayer().out)S.turn++;go('turn');autoHear()})});
}
function autoHear(){setTimeout(function(){if(S&&S.screen==='turn')say(cur().word,.9)},250)}
function vTurn(){
  var w=cur(),p=curPlayer(),total=S.players.length,host=S.mode==='host';
  var shown=ui.show==='def'?esc(w.definition):ui.show==='sen'?esc(w.example):ui.show==='pro'?'Say it like: '+esc(w.pronunciation):'';
  var head=classic()?'<div class="top"><span>Round '+S.round+' · Level '+S.level+(S.fin?(S.fin.step==='clinch'?' · winning word':' · same word'):'')+'</span><span>'+inIdx().length+' in</span></div>':
   '<div class="top"><span>Level '+S.level+' of 5 · word '+(S.turn+1)+'/'+total+'</span><span>Score '+p.score+'</span></div>';
  set('<div class="thead">'+head+
   (TV||classic()?board2():'')+'</div><div class="tmain"><div class="serif name center upname">'+esc(p.name)+', you\'re up.</div>'+
   '<button id="hear" class="hear" aria-label="Hear the word">Hear the word'+(KEYS?' (space)':'')+'</button>'+
   '<div class="startlinks"><button id="slow" class="link">Slower'+(KEYS?' (L)':'')+'</button><span class="dotsep">\u00B7</span><button id="def" class="link">Definition'+(KEYS?' (D)':'')+'</button><span class="dotsep">\u00B7</span><button id="sen" class="link">Sentence'+(KEYS?' (S)':'')+'</button></div>'+
   '<div class="txtarea">'+(shown?'<div class="card rise" id="txt">'+shown+'</div>':'')+'</div></div>'+
   '<div class="bottom turnjudge">'+(host?
     '<div class="row"><button id="ok" class="judge">Correct'+(KEYS?' (C)':'')+'</button><button id="wr" class="judge">Wrong'+(KEYS?' (W)':'')+'</button></div>':
     '<input id="ans" class="word" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="Type the spelling"><button id="chk" class="primary">Check</button>')+'</div>'+
   '<div class="corner">'+(host&&!TV?'<button id="peek" class="link">'+(ui.peek?esc(w.word):'Reveal word')+'</button>':'')+undoBtn()+'</div>',function(){
   on('hear',function(){say(w.word,.9)});on('slow',function(){say(w.word,.55)});
   on('def',function(){ui.show='def';say(w.definition,.9);vTurn()});
   on('sen',function(){ui.show='sen';say(w.example,.9);vTurn()});
   if(host){on('ok',function(){answer(true)});on('wr',function(){answer(false)});on('peek',function(){ui.peek=!ui.peek;vTurn()})}
   else{var inp=document.getElementById('ans');
     var chk=function(){answer(inp.value.trim().toLowerCase()===w.word.toLowerCase())};
     on('chk',chk);inp.onkeydown=function(e){if(e.key==='Enter')chk()}}
  });
}
function vResult(){
  var L=S.last,title=L.ok?(classic()?'Correct':'Correct +'+L.pts):'Not this time';
  set('<div class="grow center rise"><div class="small">'+esc(curPlayer().name)+' \u00b7 '+title+'</div><div class="serif tv-word">'+esc(L.word)+'</div><div class="serif spell">'+esc(L.word.toUpperCase().split('').join(' '))+'</div></div><div class="bottom"><button id="n" class="primary">Next</button></div>',function(){on('n',afterResult)});
}
function vLevelup(){
  set('<div class="grow center"><div style="height:6vh"></div><div class="small">Level '+S.level+' done</div><div class="serif hero">Level '+(S.level+1)+': '+LEVELS[S.level]+'</div><div class="card" style="text-align:left">'+board()+'</div></div>'+
   '<div class="bottom"><button id="n" class="primary">Next level</button></div>',function(){
   on('n',function(){S.level++;S.turn=0;buildPool();go('intro')})});
}
function vBanner(){
  var b=S.banner;
  set('<div class="grow center rise"><div style="height:4vh"></div>'+board2()+'<div class="serif hero" id="btitle">'+esc(b.title)+'</div><p style="font-size:1.1em">'+esc(b.text)+'</p></div>'+
   '<div class="bottom"><button id="n" class="primary">Continue</button></div>',function(){on('n',bannerNext)});
}
function vWin(){
  var w=S.players[S.winner],rest=S.players.filter(function(p){return p!==w}).sort(function(a,b){return (b.outRound||0)-(a.outRound||0)});
  set('<div class="grow center"><div class="small" style="margin-top:4vh">Winner</div><div class="serif hero" id="winner">'+esc(w.name)+'</div><p>Last speller standing after '+S.round+' round'+(S.round>1?'s':'')+'.</p>'+
   '<div class="card" style="text-align:left"><table>'+rest.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+(p.outRound?'out in round '+p.outRound:'')+'</td></tr>'}).join('')+'</table></div></div>'+
   '<div class="bottom"><button id="again" class="primary">Play again with the same players</button><button id="new">New game</button></div>',function(){
   on('again',function(){cfg.game='classic';newGame(S.players.map(function(p){return p.name}));render()});
   on('new',function(){localStorage.removeItem(KEY);ui.names=[];S=null;vStart()});
  });
  confetti();
}
function vEnd(){
  var ps=S.players.slice().sort(function(a,b){return b.score-a.score});
  var top=ps[0].score,wins=ps.filter(function(p){return p.score===top}).map(function(p){return p.name});
  set('<div class="grow center"><div class="small" style="margin-top:4vh">Winner</div><div class="serif hero">'+esc(wins.join(' & '))+'</div>'+
   '<div class="card" style="text-align:left">'+board()+'</div>'+
   '<div class="card small" style="text-align:left">'+ps.map(function(p){return esc(p.name)+': best word '+(p.best?esc(p.best.word)+' (L'+p.best.level+')':'none')}).join('<br>')+'</div></div>'+
   '<div class="bottom"><button id="again" class="primary">Play again with the same players</button><button id="new">New game</button></div>',function(){
   on('again',function(){cfg.game='points';newGame(S.players.map(function(p){return p.name}));render()});
   on('new',function(){localStorage.removeItem(KEY);ui.names=[];S=null;vStart()});
  });
  confetti();
}

/* team buzzer */
function tDefault(){return [{name:'Team 1'},{name:'Team 2'}]}
function vTeams(){
  S=null;if(!ui.teams)ui.teams=tDefault();
  set('<div class="grow"><button id="bk" class="link backlink">‹ Back</button><h1 class="serif">Name your teams</h1><div class="tcols">'+ui.teams.map(function(t,ti){return '<div class="tcol tc'+ti+'"><label class="small" for="tn'+ti+'">Team '+(ti+1)+'</label><input type="text" class="tname" id="tn'+ti+'" value="'+esc(t.name)+'"></div>'}).join('')+'</div>'+
   '<p class="thint">Each face-off, send the next person up from each team.</p></div>'+
   '<div class="bottom"><button id="eat" class="primary">Start</button></div>',function(){
   on('bk',vStart);try{history.pushState({s:'setup'},'')}catch(e){}[0,1].forEach(function(ti){document.getElementById('tn'+ti).oninput=function(){ui.teams[ti].name=this.value}});
   on('eat',function(){
     var T=ui.teams.map(function(t,ti){return{name:t.name.trim()||('Team '+(ti+1)),score:0}});
     speechPrime();tNew(T);render();autoHear()});
  });
}
function tNew(T){
  S={game:'teams',mode:'host',screen:'tturn',level:1,fo:0,players:[],teams:T,used:[],phase:'listen',buzz:null,steal:null,last:null,prev:null};
  S.total=15;
  S.cw=tPick();save();
}
function tPick(){
  var used=S.used,l,c=[];
  for(l=S.level;l<=5&&!c.length;l++)c=WORDS.filter(function(w){return w.level===l&&used.indexOf(w.word)<0});
  if(!c.length)c=WORDS.filter(function(w){return used.indexOf(w.word)<0});
  if(!c.length)return null;
  var w=c[Math.floor(Math.random()*c.length)];used.push(w.word);return w;
}
function tWho(t){return S.teams[t].name}
function tSnap(){var s=JSON.parse(JSON.stringify(S));s.prev=null;S.prev=s}
var actx=null;
function buzzSound(t){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=t?196:262;g.gain.setValueAtTime(.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.45);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.45)}catch(e){console.warn('buzzer sound',e)}}
function tBuzz(t){
  if(S.phase==='listen'||(S.phase==='steal'&&t===S.steal)){speechSynthesis&&speechSynthesis.cancel();tSnap();S.buzz=t;S.phase=S.phase==='steal'?'stealbuzzed':'buzzed';buzzSound(t);save();render()}
}
function tJudge(ok){
  if(S.buzz===null)return;
  tSnap();var t=S.buzz,w=S.cw;
  if(ok){S.teams[t].score++;S.last={ok:true,word:w.word,team:t,name:tWho(t),steal:S.phase==='stealbuzzed'};S.screen='tresult';S.done=(S.done||0)+1}
  else if(S.phase==='buzzed'){S.steal=1-t;S.buzz=null;S.phase='steal'}
  else{S.last={ok:false,word:w.word};S.screen='tresult';S.done=(S.done||0)+1}
  save();render();
}
function tNext(){
  S.fo++;S.level=Math.min(5,1+Math.floor(S.fo*5/S.total));
  S.phase='listen';S.buzz=null;S.steal=null;S.cw=tPick();
  if(!S.cw)return go('twin');
  go('tturn');autoHear();
}
function tScores(){return '<div class="tscore">'+S.teams.map(function(t,i){return '<div class="ts ts'+i+(S.buzz===i?' hot':'')+'"><span>'+esc(t.name)+'</span><b>'+t.score+'</b></div>'}).join('')+'</div>'}
function vTTurn(){
  var w=S.cw,a=tWho(0),b=tWho(1),ph=S.phase;
  var shown=ui.show==='def'?esc(w.definition):ui.show==='sen'?esc(w.example):'';
  var status=ph==='listen'?'First to buzz spells it.':ph==='steal'?esc(tWho(S.steal))+' can steal. Buzz in.':esc(tWho(S.buzz))+(ph==='stealbuzzed'?' is stealing. Spell it.':' buzzed. Spell it.');
  var bz=function(i){var dis=ph==='steal'?i!==S.steal:ph!=='listen';var hot=S.buzz===i;
    return '<button id="bz'+i+'" class="buzzer bz'+i+(hot?' hot':'')+'"'+(dis&&!hot?' disabled':'')+'><span>'+esc(S.teams[i].name)+'</span><b>'+(hot?'Buzzed':'Buzz')+'</b>'+(KEYS?'<small>'+(i?'L':'A')+'</small>':'')+'</button>'};
  set('<div class="thead"><div class="top"><span>Face-off '+(S.fo+1)+'</span><span>Level '+S.level+'</span></div>'+tScores()+'</div>'+
   '<div class="tmain"><div class="serif name center upname">'+esc(a)+' vs '+esc(b)+'</div>'+
   '<button id="hear" class="hear" aria-label="Hear the word">Hear the word'+(KEYS?' (space)':'')+'</button>'+
   '<div class="startlinks"><button id="slow" class="link">Slower</button><span class="dotsep">·</span><button id="def" class="link">Definition'+(KEYS?' (D)':'')+'</button><span class="dotsep">·</span><button id="sen" class="link">Sentence'+(KEYS?' (S)':'')+'</button></div>'+
   '<div class="txtarea">'+(shown?'<div class="card rise" id="txt">'+shown+'</div>':'')+'</div></div>'+
   '<div class="bottom turnjudge"><p class="tstatus" id="tstatus">'+status+'</p><div class="buzzers">'+bz(0)+bz(1)+'</div>'+
   (S.buzz!==null?'<div class="row"><button id="ok" class="judge">Correct'+(KEYS?' (C)':'')+'</button><button id="wr" class="judge">Wrong'+(KEYS?' (W)':'')+'</button></div>':'')+'</div>'+
   '<div class="corner">'+(!TV?'<button id="peek" class="link">'+(ui.peek?esc(w.word):'Reveal word')+'</button>':'')+undoBtn()+'<button id="fin" class="link">Finish</button></div>',function(){
   on('hear',function(){say(w.word,.9)});on('slow',function(){say(w.word,.55)});
   on('def',function(){ui.show='def';say(w.definition,.9);vTTurn()});
   on('sen',function(){ui.show='sen';say(w.example,.9);vTTurn()});
   on('bz0',function(){tBuzz(0)});on('bz1',function(){tBuzz(1)});
   on('ok',function(){tJudge(true)});on('wr',function(){tJudge(false)});
   on('peek',function(){ui.peek=!ui.peek;vTTurn()});
   on('fin',function(){tSnap();go('twin')});
  });
}
function vTResult(){
  var L=S.last,title=L.ok?esc(L.name)+(L.steal?' stole it':' got it')+' · +1 '+esc(S.teams[L.team].name):'Both missed · no point';
  set('<div class="thead">'+tScores()+'</div><div class="grow center rise"><div class="small">'+title+'</div><div class="serif tv-word">'+esc(L.word)+'</div><div class="serif spell">'+esc(L.word.toUpperCase().split('').join(' '))+'</div></div>'+
   '<div class="bottom"><button id="n" class="primary">Next face-off</button></div><div class="corner"><button id="fin" class="link">Finish</button></div>',function(){on('n',tNext);on('fin',function(){tSnap();go('twin')})});
}
function vTWin(){
  var T=S.teams,tie=T[0].score===T[1].score,w=T[0].score>T[1].score?T[0]:T[1];
  set('<div class="grow center"><div class="small">'+(tie?'It\'s a tie':'Winner')+'</div><div class="serif hero" id="winner">'+(tie?esc(T[0].name)+' & '+esc(T[1].name):esc(w.name))+'</div>'+
   '<p>'+T[0].score+' to '+T[1].score+' after '+(S.done||0)+' face-offs.</p>'+
   '<div class="card" style="text-align:left"><table>'+T.map(function(t){return '<tr><td>'+esc(t.name)+'</td><td>'+t.score+'</td></tr>'}).join('')+'</table></div></div>'+
   '<div class="bottom"><button id="again" class="primary">Play again with the same teams</button><button id="new">New game</button></div>',function(){
   on('again',function(){tNew(S.teams.map(function(t){return{name:t.name,score:0}}));render();autoHear()});
   on('new',function(){localStorage.removeItem(KEY);S=null;vStart()});
  });
  confetti();
}
function confetti(){
  var c=['#e8b04a','#8e2a2a'];
  for(var i=0;i<40;i++){var d=document.createElement('div');d.className='conf';
    d.style.left=Math.random()*100+'vw';d.style.background=c[i%2];d.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(d);setTimeout(function(x){x.remove()},2100,d)}
}
document.addEventListener('keydown',function(e){
  if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
  var tag=(e.target.tagName||'').toLowerCase();if(tag==='input')return;
  var k=e.key.toLowerCase(),map={};
  if(k==='u'&&S.prev){e.preventDefault();return undo()}
  if(S.screen==='tturn')map={' ':'hear','d':'def','s':'sen','c':'ok','w':'wr','a':'bz0','l':'bz1'};
  else if(S.screen==='turn')map={' ':'hear','d':'def','s':'sen','c':'ok','w':'wr','l':'slow'};
  else if(S.screen==='result'||S.screen==='tresult')map={'r':'rv',' ':'n','enter':'n','n':'n'};
  else map={' ':'n','enter':'n','n':'n','b':'b'};
  var id=map[k];if(!id)return;
  var el=document.getElementById(id)||(id==='n'&&document.getElementById('b'));
  if(!el)return;e.preventDefault();if(document.activeElement)document.activeElement.blur();el.click();
});
if(!window.speechSynthesis){console.warn('speechSynthesis not available; text only')}
vStart();
</script></body></html>
