<script>
"use strict";
var WORDS=JSON.parse(document.getElementById('words').textContent).words;
var LEVELS=['Appetizer','Side Dish','Main Course','Second Helping','Pumpkin Pie Boss'];
var KEY='gobble-bee-2026';
var app=document.getElementById('app');
var S=null;            // game state (persisted)
var cfg={mode:'host',sudden:false};
var ui={show:'',peek:false,names:[]};   // transient
var voice=null;

function $(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* speech */
function pickVoice(){
  if(!window.speechSynthesis)return;
  var v=speechSynthesis.getVoices();
  voice=v.filter(function(x){return x.lang==='en-US'||x.lang==='en_US'})[0]||v.filter(function(x){return /^en/.test(x.lang)})[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.rate=rate||.9;u.lang='en-US';if(voice)u.voice=voice;
  speechSynthesis.speak(u);
}

/* state */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){console.warn('save failed',e)}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function newGame(names){
  S={mode:cfg.mode,sudden:cfg.sudden,screen:'intro',level:1,turn:0,
     players:names.map(function(n){return{name:n,score:0,misses:0,out:false,best:null}}),pool:[],last:null};
  buildPool();save();
}
function buildPool(){
  var lw=WORDS.filter(function(w){return w.level===S.level});
  var need=S.players.length*2,pool=shuffle(lw);
  while(pool.length<need)pool=pool.concat(shuffle(lw));
  S.pool=pool.slice(0,Math.max(need,10));
}
function cur(){return S.pool[S.turn]}
function curPlayer(){return S.players[S.turn%S.players.length]}
function go(screen){S.screen=screen;ui.show='';ui.peek=false;save();render()}

function nextTurn(){
  var total=S.players.length*2;
  S.turn++;
  while(S.turn<total&&S.sudden&&curPlayer().out)S.turn++;
  if(S.turn>=total||S.players.every(function(p){return p.out})){
    if(S.level>=5||S.players.every(function(p){return p.out}))return go('end');
    return go('levelup');
  }
  go('turn');
}
function answer(ok){
  var w=cur(),p=curPlayer();
  if(ok){p.score+=w.level;if(!p.best||w.level>=p.best.level)p.best={word:w.word,level:w.level}}
  else{p.misses++;if(S.sudden&&p.misses>=2)p.out=true}
  S.last={ok:ok,word:w.word,pts:w.level};
  S.screen='result';save();render();
  if(ok)setTimeout(function(){if(S.screen==='result')afterResult()},900);
}
function afterResult(){
  if(cur().easter_egg)go('egg');else nextTurn();
}

/* views */
function board(){
  var ps=S.players.slice().sort(function(a,b){return b.score-a.score});
  return '<table>'+ps.map(function(p){return'<tr><td>'+esc(p.name)+(p.out?' (out)':'')+'</td><td>'+p.score+'</td></tr>'}).join('')+'</table>';
}
function set(html,bind){app.innerHTML=html;bind&&bind()}
function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}

function render(){
  var f={start:vStart,players:vPlayers,intro:vIntro,turn:vTurn,result:vResult,egg:vEgg,levelup:vLevelup,end:vEnd}[S?S.screen:'start'];
  window.scrollTo(0,0);f();
}
function vStart(){
  var saved=load();
  set('<div class="grow center"><div style="height:8vh"></div><h1 class="serif">The Great Gobble Bee</h1>'+
   '<p>Five courses of words. One family. No mercy.</p></div>'+
   '<div class="bottom"><div class="row"><button id="mh" class="tog '+(cfg.mode==='host'?'on':'')+'">Host reads</button><button id="mt" class="tog '+(cfg.mode==='type'?'on':'')+'">Type it</button></div>'+
   '<button id="sd" class="tog '+(cfg.sudden?'on':'')+'">Sudden death: '+(cfg.sudden?'on':'off')+'</button>'+
   '<button id="go" class="primary">Start</button>'+
   (saved&&saved.screen&&saved.screen!=='end'?'<button id="res">Resume game</button>':'')+'</div>',function(){
   on('mh',function(){cfg.mode='host';S=null;vStart()});on('mt',function(){cfg.mode='type';S=null;vStart()});
   on('sd',function(){cfg.sudden=!cfg.sudden;S=null;vStart()});
   on('go',function(){S=null;ui.names=ui.names.length?ui.names:['Player 1','Player 2'];vPlayers()});
   on('res',function(){S=saved;speechPrime();render()});
  });
  S=null;
}
function speechPrime(){if(window.speechSynthesis){var u=new SpeechSynthesisUtterance('');speechSynthesis.speak(u)}}
function vPlayers(){
  S=null;
  set('<div class="grow"><h1 class="serif" style="font-size:44px">Who is playing?</h1><div id="pl"></div></div>'+
   '<div class="bottom"><button id="add">+ Add player</button><button id="eat" class="primary">Let\'s eat</button></div>',function(){
   var box=document.getElementById('pl');
   ui.names.forEach(function(n,i){
     var r=$('<div class="prow"><input type="text" aria-label="Player '+(i+1)+' name" value="'+esc(n)+'"><button aria-label="Remove player '+(i+1)+'">x</button></div>');
     r.firstChild.oninput=function(){ui.names[i]=this.value};
     r.lastChild.onclick=function(){if(ui.names.length>1){ui.names.splice(i,1);vPlayers()}};
     box.appendChild(r)});
   on('add',function(){if(ui.names.length<10){ui.names.push('Player '+(ui.names.length+1));vPlayers()}});
   on('eat',function(){
     var n=ui.names.map(function(x,i){return x.trim()||('Player '+(i+1))});
     speechPrime();cfg.sudden=cfg.sudden;newGame(n);render()});
  });
}
function vIntro(){
  set('<div class="top"><span>The Great Gobble Bee</span></div><div class="grow center"><div style="height:8vh"></div><div class="small">LEVEL</div><div class="serif big" style="font-size:120px">'+S.level+'</div>'+
   '<div class="serif name">'+LEVELS[S.level-1]+'</div><p>Each speller gets 2 words</p></div><div class="bottom"><button id="b" class="primary">Begin</button></div>',function(){
   on('b',function(){S.turn=0;while(S.sudden&&curPlayer().out)S.turn++;go('turn');autoHear()})});
}
function autoHear(){setTimeout(function(){if(S&&S.screen==='turn')say(cur().word,.9)},250)}
function vTurn(){
  var w=cur(),p=curPlayer(),total=S.players.length*2,host=S.mode==='host';
  var shown=ui.show==='def'?esc(w.definition):ui.show==='sen'?esc(w.example):ui.show==='pro'?'Say it like: '+esc(w.pronunciation):'';
  set('<div class="top"><span>Level '+S.level+' of 5 · word '+(S.turn+1)+'/'+total+'</span><span>Score '+p.score+'</span></div>'+
   '<div class="serif name center" style="margin:10px 0 4px;font-size:calc(40px*var(--s))">'+esc(p.name)+', you\'re up.</div>'+
   '<div class="grow"></div>'+
   '<div class="row"><button id="hear" class="hear" aria-label="Hear the word">&#128266; Hear the word</button><button id="slow" style="min-height:96px;flex:.5">Slow</button></div>'+
   (shown?'<div class="card rise" id="txt">'+shown+'</div>':'')+
   '<div class="row" style="margin-top:12px"><button id="def">Definition</button><button id="sen">Sentence</button></div>'+
   '<div class="bottom">'+(host?
     '<div class="row"><button id="wr" style="min-height:72px">Wrong</button><button id="ok" class="primary" style="min-height:72px">Correct</button></div>'+
     '<button id="peek" class="ghost">'+(ui.peek?esc(w.word):'peek')+'</button>':
     '<input id="ans" class="word" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="Type the spelling"><button id="chk" class="primary">Check</button>')+'</div>',function(){
   on('hear',function(){say(w.word,.9)});on('slow',function(){say(w.word,.55)});
   on('def',function(){ui.show='def';say(w.definition,.9);vTurn()});
   on('sen',function(){ui.show='sen';say(w.example,.9);vTurn()});
   if(host){on('ok',function(){answer(true)});on('wr',function(){answer(false)});on('peek',function(){ui.peek=!ui.peek;vTurn()})}
   else{var inp=document.getElementById('ans');
     var chk=function(){answer(inp.value.trim().toLowerCase()===w.word.toLowerCase())};
     on('chk',chk);inp.onkeydown=function(e){if(e.key==='Enter')chk()}}
  });
}
function vResult(){
  var L=S.last;
  if(L.ok){
    set('<div class="wash"><div class="serif big center">Yes! +'+L.pts+'</div></div>');
  }else{
    set('<div class="grow center"><div style="height:12vh"></div><div class="serif big">So close</div><p>The word is</p><div class="serif spell">'+esc(L.word.split('').join(' '))+'</div></div><div class="bottom"><button id="n" class="primary">Next</button></div>',function(){on('n',afterResult)});
  }
}
function vEgg(){
  var w=WORDS.filter(function(x){return x.word===S.last.word})[0];
  set('<div class="grow center rise"><div style="height:10vh"></div><div class="small" style="letter-spacing:.15em;text-transform:uppercase">'+esc(w.theme)+'</div>'+
   '<div class="serif big" style="margin:.2em 0">'+esc(w.word)+'</div><p style="font-size:1.25em">'+esc(w.easter_egg)+'</p></div><div class="bottom"><button id="n" class="primary">Ha! Next</button></div>',function(){on('n',nextTurn)});
}
function vLevelup(){
  set('<div class="grow center"><div style="height:6vh"></div><div class="small">LEVEL '+S.level+' DONE</div><div class="serif big">Level '+(S.level+1)+': '+LEVELS[S.level]+'</div><div class="card" style="text-align:left">'+board()+'</div></div>'+
   '<div class="bottom"><button id="n" class="primary">Next level</button></div>',function(){
   on('n',function(){S.level++;S.turn=0;buildPool();go('intro')})});
}
function vEnd(){
  var ps=S.players.slice().sort(function(a,b){return b.score-a.score});
  var top=ps[0].score,wins=ps.filter(function(p){return p.score===top}).map(function(p){return p.name});
  set('<div class="grow center"><div class="small" style="margin-top:4vh">WINNER</div><div class="serif big">'+esc(wins.join(' & '))+'</div>'+
   '<div class="card" style="text-align:left">'+board()+'</div>'+
   '<div class="card small" style="text-align:left">'+ps.map(function(p){return esc(p.name)+': best word '+(p.best?esc(p.best.word)+' (L'+p.best.level+')':'none')}).join('<br>')+'</div></div>'+
   '<div class="bottom"><button id="again" class="primary">Play again (same players)</button><button id="new">New game</button></div>',function(){
   on('again',function(){newGame(S.players.map(function(p){return p.name}));render()});
   on('new',function(){localStorage.removeItem(KEY);ui.names=[];S=null;vStart()});
  });
  confetti();
}
function confetti(){
  var c=['#e8b04a','#8e2a2a'];
  for(var i=0;i<40;i++){var d=document.createElement('div');d.className='conf';
    d.style.left=Math.random()*100+'vw';d.style.background=c[i%2];d.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(d);setTimeout(function(x){x.remove()},2100,d)}
}
if(!window.speechSynthesis){console.warn('speechSynthesis not available; text only')}
vStart();
</script></body></html>
